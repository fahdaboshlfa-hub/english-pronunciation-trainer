<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/english-pronunciation-trainer/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-app</title>
    <script type="module" crossorigin src="/english-pronunciation-trainer/assets/index-BqnhGmi1.js"></script>
    <link rel="stylesheet" crossorigin href="/english-pronunciation-trainer/assets/index-nqMpL4T3.css">

    <!-- ═══ أقسام جديدة - إضافة تحت الموقع الأصلي ═══ -->
    <style>
      #extra-sections {
        max-width: 700px;
        margin: 0 auto;
        padding: 16px 20px 48px;
        font-family: 'Inter', 'Segoe UI', sans-serif;
      }
      .ex-divider {
        display: flex; align-items: center; gap: 12px;
        color: #888; font-size: .78rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: .8px;
        margin: 8px 0 18px;
      }
      .ex-divider::before,.ex-divider::after {
        content:''; flex:1; height:1px; background:#2e3250;
      }
      .ex-block {
        background: #1e2235;
        border: 1px solid #2e3250;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 14px;
      }
      .ex-label {
        font-size: .75rem; font-weight: 700; color: #f5a623;
        text-transform: uppercase; letter-spacing: .9px;
        margin-bottom: 12px; display: flex; align-items: center; gap: 7px;
      }
      /* زر الاستماع */
      .ex-listen-btn {
        width: 100%;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        background: #f5a623; border: none; border-radius: 12px;
        color: #000; font-weight: 700; font-size: 1rem;
        padding: 14px 20px; cursor: pointer; transition: opacity .2s;
      }
      .ex-listen-btn:hover { opacity: .88; }
      .ex-listen-btn.playing { background: #22c55e; }
      .ex-speed-row { display: flex; gap: 7px; margin-top: 10px; }
      .ex-spd {
        flex: 1; background: #22263a; border: 1px solid #2e3250;
        color: #8b8fa8; border-radius: 8px; padding: 7px;
        font-size: .8rem; font-weight: 600; cursor: pointer;
        transition: all .2s; font-family: inherit;
      }
      .ex-spd.on, .ex-spd:hover {
        background: rgba(245,166,35,.15); border-color: #f5a623; color: #f5a623;
      }
      /* خانات الكتابة */
      .ex-field {
        width: 100%; background: #0f1117;
        border: 1.5px solid #2e3250; border-radius: 10px;
        color: #eef0f8; font-family: inherit; font-size: .95rem;
        padding: 13px 16px; outline: none; resize: none;
        min-height: 80px; direction: ltr; text-align: left;
        line-height: 1.6; transition: border-color .2s;
      }
      .ex-field:focus { border-color: #f5a623; }
      .ex-field.filled { border-color: #22c55e; background: rgba(34,197,94,.03); }
      .ex-field::placeholder { color: #5a5f78; font-size: .88rem; direction: rtl; text-align: right; }
      /* أزرار التحقق */
      .ex-btn-row { display: flex; gap: 10px; margin-top: 10px; }
      .ex-btn {
        flex: 1; background: #22263a; border: 1.5px solid #2e3250;
        color: #eef0f8; border-radius: 10px; padding: 12px;
        cursor: pointer; font-family: inherit; font-weight: 600;
        font-size: .9rem; transition: all .2s;
      }
      .ex-btn:hover { background: #2e3250; }
      .ex-btn.primary { background: #f5a623; border-color: #f5a623; color: #000; }
      .ex-btn.primary:hover { opacity: .88; }
      /* المايك */
      .ex-mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; }
      .ex-mic {
        width: 72px; height: 72px; border-radius: 50%;
        background: #f5a623; border: none; cursor: pointer;
        font-size: 1.8rem; display: flex; align-items: center; justify-content: center;
        transition: all .2s;
      }
      .ex-mic.rec {
        background: #ef4444;
        animation: expulse 1s infinite;
        box-shadow: 0 0 0 14px rgba(239,68,68,.12);
      }
      @keyframes expulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
      .ex-mic-lbl { font-size: .85rem; color: #7a7f9a; text-align: center; }
      .ex-mic-lbl.rec { color: #ef4444; }
      /* نتيجة */
      .ex-result {
        background: rgba(255,255,255,.02); border: 1px solid #2e3250;
        border-radius: 11px; padding: 16px; margin-top: 12px; display: none;
      }
      .ex-r-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .ex-acc { font-size: 2rem; font-weight: 700; color: #f5a623; font-family: 'Space Grotesk', sans-serif; }
      .ex-lbl { font-size: .72rem; color: #7a7f9a; text-transform: uppercase; letter-spacing: .5px; }
      .ex-badge { font-size: .8rem; font-weight: 700; padding: 5px 13px; border-radius: 20px; }
      .ex-b-g { background: rgba(34,197,94,.14); color: #22c55e; }
      .ex-b-y { background: rgba(245,166,35,.14); color: #f5a623; }
      .ex-b-r { background: rgba(239,68,68,.1); color: #ef4444; }
      .ex-diff {
        font-size: 1.05rem; line-height: 2;
        direction: ltr; text-align: left;
        background: #0f1117; padding: 12px 15px; border-radius: 9px;
        margin-bottom: 10px;
      }
      .xc{color:#22c55e} .xw{color:#ef4444} .xm{color:#facc15} .xe{color:#a855f7}
      .ex-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .72rem; color: #7a7f9a; direction: rtl; }
      .ex-dot { width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:3px; }
      .ex-msg {
        margin-top: 11px; font-size: .86rem; color: #7a7f9a;
        background: #0f1117; padding: 10px 14px;
        border-radius: 8px; border-right: 3px solid #f5a623;
      }
      .ex-toast {
        position: fixed; bottom: 22px; right: 50%; transform: translateX(50%);
        background: #1e2235; border: 1px solid #2e3250; color: #eef0f8;
        padding: 10px 22px; border-radius: 20px; font-size: .83rem;
        z-index: 9999; opacity: 0; transition: opacity .3s;
        pointer-events: none; white-space: nowrap;
      }
      .ex-toast.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ═══════════════════════════════════════════════
         الأقسام الجديدة — تظهر تحت الموقع الأصلي
    ════════════════════════════════════════════════ -->
    <div id="extra-sections">

      <div class="ex-divider">تدريب إضافي — استمع واكتب وانطق</div>

      <!-- ① زر الاستماع -->
      <div class="ex-block">
        <div class="ex-label">🔊 استمع للجملة</div>
        <button class="ex-listen-btn" id="exListenBtn" onclick="exListen()">
          <span id="exListenIcon">🔊</span>
          <span id="exListenTxt">اضغط للاستماع للجملة الحالية</span>
        </button>
        <div class="ex-speed-row">
          <button class="ex-spd on" data-spd="0.75" onclick="exSetSpd(this)">🐢 بطيء</button>
          <button class="ex-spd"    data-spd="1"    onclick="exSetSpd(this)">⚡ عادي</button>
          <button class="ex-spd"    data-spd="1.25" onclick="exSetSpd(this)">🚀 سريع</button>
        </div>
      </div>

      <!-- ② اكتب ما سمعته -->
      <div class="ex-block">
        <div class="ex-label">✍️ اكتب ما سمعته من الذكاء الاصطناعي</div>
        <textarea class="ex-field" id="exDictField"
          placeholder="استمع للجملة ثم اكتب هنا ما سمعته بدون أن تنظر للجملة الأصلية..."></textarea>
        <div class="ex-btn-row">
          <button class="ex-btn" onclick="exClearDict()">مسح</button>
          <button class="ex-btn primary" onclick="exCheckDict()">✅ تحقق من إجابتي</button>
        </div>
        <div class="ex-result" id="exDictRes">
          <div class="ex-r-top">
            <div><div class="ex-lbl">دقة الإملاء</div><div class="ex-acc" id="exDAcc">0%</div></div>
            <span class="ex-badge" id="exDBadge"></span>
          </div>
          <div class="ex-diff" id="exDDiff"></div>
          <div class="ex-legend">
            <span><span class="ex-dot" style="background:#22c55e"></span>صحيح</span>
            <span><span class="ex-dot" style="background:#ef4444"></span>غلط</span>
            <span><span class="ex-dot" style="background:#facc15"></span>ناقصة</span>
            <span><span class="ex-dot" style="background:#a855f7"></span>زايدة</span>
          </div>
          <div class="ex-msg" id="exDMsg"></div>
        </div>
      </div>

      <!-- ③ ميكروفون -->
      <div class="ex-block">
        <div class="ex-label">🎙️ ميكروفون — انطق الجملة</div>
        <div class="ex-mic-wrap">
          <button class="ex-mic" id="exMicBtn" onclick="exToggleMic()">🎙️</button>
          <div class="ex-mic-lbl" id="exMicLbl">اضغط المايك ثم انطق الجملة</div>
        </div>
      </div>

      <!-- ④ كتابة كلامك -->
      <div class="ex-block">
        <div class="ex-label">📝 كتابة المسموع — كلامك أنت</div>
        <textarea class="ex-field" id="exSpeechField"
          placeholder="كلامك سيظهر هنا تلقائياً بعد الضغط على المايك والكلام...&#10;(تقدر تعدّل يدوياً إذا أردت)"></textarea>
        <div class="ex-btn-row">
          <button class="ex-btn" onclick="exClearSpeech()">مسح</button>
          <button class="ex-btn primary" onclick="exCheckSpeech()">📊 قيّم نطقي</button>
        </div>
        <div class="ex-result" id="exSpeechRes">
          <div class="ex-r-top">
            <div><div class="ex-lbl">دقة النطق</div><div class="ex-acc" id="exSAcc">0%</div></div>
            <span class="ex-badge" id="exSBadge"></span>
          </div>
          <div class="ex-diff" id="exSDiff"></div>
          <div class="ex-legend">
            <span><span class="ex-dot" style="background:#22c55e"></span>صحيح</span>
            <span><span class="ex-dot" style="background:#ef4444"></span>غلط</span>
            <span><span class="ex-dot" style="background:#facc15"></span>ناقصة</span>
            <span><span class="ex-dot" style="background:#a855f7"></span>زايدة</span>
          </div>
          <div class="ex-msg" id="exSMsg"></div>
        </div>
      </div>

    </div><!-- end #extra-sections -->

    <div class="ex-toast" id="exToast"></div>

    <script>
    // ── يقرأ الجملة الحالية من الـ React app ─────────────────────
    var exSpeed = 0.75;
    var exRecog = null;

    function exGetCurrentSentence() {
      // يحاول يجيب الجملة من أي عنصر نصي كبير بالصفحة
      var selectors = [
        'h2', 'h3', '.sentence', '[class*="sentence"]',
        '[class*="text"]', 'p', 'strong'
      ];
      for (var i = 0; i < selectors.length; i++) {
        var els = document.querySelectorAll(selectors[i]);
        for (var j = 0; j < els.length; j++) {
          var txt = els[j].innerText.trim();
          // الجملة الإنجليزية: تبدأ بحرف إنجليزي وفيها أكثر من 3 كلمات
          if (/^[A-Za-z]/.test(txt) && txt.split(' ').length > 3) {
            return txt;
          }
        }
      }
      return null;
    }

    function exListen() {
      var text = exGetCurrentSentence();
      if (!text) { exToast('تأكد إن في جملة ظاهرة بالموقع فوق'); return; }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = exSpeed;
      var voices = speechSynthesis.getVoices();
      var v = voices.find(function(x){return x.lang.indexOf('en')===0&&x.localService;})
              || voices.find(function(x){return x.lang.indexOf('en')===0;});
      if (v) u.voice = v;
      var btn = document.getElementById('exListenBtn');
      var txt = document.getElementById('exListenTxt');
      u.onstart = function(){ btn.classList.add('playing'); txt.textContent = 'يشتغل...'; };
      u.onend   = function(){ btn.classList.remove('playing'); txt.textContent = 'اضغط للاستماع مرة أخرى'; };
      speechSynthesis.speak(u);
    }
    speechSynthesis.onvoiceschanged = function(){};

    function exSetSpd(btn) {
      document.querySelectorAll('.ex-spd').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      exSpeed = parseFloat(btn.dataset.spd);
    }

    function exToggleMic() {
      if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
        exToast('افتح بـ Chrome لدعم المايك'); return;
      }
      if (exRecog) { exRecog.stop(); return; }
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      exRecog = new SR();
      exRecog.lang = 'en-US'; exRecog.interimResults = true; exRecog.continuous = false;
      var sf  = document.getElementById('exSpeechField');
      var mb  = document.getElementById('exMicBtn');
      var ml  = document.getElementById('exMicLbl');
      exRecog.onstart = function(){
        mb.classList.add('rec'); mb.textContent = '⏹️';
        ml.textContent = '🔴 يسجل... تكلم الآن'; ml.classList.add('rec');
        sf.value = ''; sf.classList.remove('filled');
        document.getElementById('exSpeechRes').style.display = 'none';
      };
      exRecog.onresult = function(e){
        var interim='', final='';
        for (var i=e.resultIndex;i<e.results.length;i++){
          if(e.results[i].isFinal) final += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        sf.value = final || interim;
        if (final) sf.classList.add('filled');
      };
      exRecog.onerror = function(e){ exToast('خطأ: '+e.error); exResetMic(); };
      exRecog.onend   = function(){
        exResetMic(); exRecog = null;
        if (document.getElementById('exSpeechField').value.trim())
          setTimeout(exCheckSpeech, 350);
      };
      exRecog.start();
    }

    function exResetMic(){
      var mb = document.getElementById('exMicBtn');
      var ml = document.getElementById('exMicLbl');
      mb.classList.remove('rec'); mb.textContent = '🎙️';
      ml.textContent = 'انتهى — اضغط مجدداً للتسجيل'; ml.classList.remove('rec');
    }

    // ── تقييم ────────────────────────────────────────────────────
    function exNm(t){ return t.toLowerCase().replace(/[^a-z0-9\s']/g,'').replace(/\s+/g,' ').trim(); }

    function exCalc(target, written){
      var tw=exNm(target).split(' '), ww=exNm(written).split(' ');
      var m=0, u=new Array(ww.length).fill(false);
      tw.forEach(function(w){
        var i=ww.findIndex(function(s,j){return !u[j]&&s===w;});
        if(i!==-1){u[i]=true;m++;}
      });
      return Math.round((m/Math.max(tw.length,ww.length))*100);
    }

    function exDiff(target, written){
      var tw=exNm(target).split(' '), ww=exNm(written).split(' ');
      var res=[], u=new Array(ww.length).fill(false);
      tw.forEach(function(w){
        var i=ww.findIndex(function(s,j){return !u[j]&&s===w;});
        if(i!==-1){u[i]=true;res.push({word:w,s:'correct'});}
        else res.push({word:w,s:'wrong'});
      });
      ww.forEach(function(w,i){ if(!u[i]) res.push({word:w,s:'extra'}); });
      return res;
    }

    function exShowRes(accId,badgeId,diffId,msgId,containerId,target,written){
      var acc=exCalc(target,written), d=exDiff(target,written);
      document.getElementById(accId).textContent = acc+'%';
      var bd=document.getElementById(badgeId);
      if(acc>=85){bd.textContent='🌟 ممتاز';bd.className='ex-badge ex-b-g';}
      else if(acc>=60){bd.textContent='👍 جيد';bd.className='ex-badge ex-b-y';}
      else{bd.textContent='💪 تمرن أكثر';bd.className='ex-badge ex-b-r';}
      var cm={correct:'xc',wrong:'xw',missing:'xm',extra:'xe'};
      document.getElementById(diffId).innerHTML=d.map(function(x){
        return '<span class="'+cm[x.s]+'">'+x.word+'</span>';
      }).join(' ');
      document.getElementById(msgId).textContent =
        acc>=85 ? 'ممتاز! كلامك/كتابتك قريبة جداً من الأصلي 🎯' :
        acc>=60 ? 'جيد، ركّز على الكلمات الحمراء وكررها.' :
        'حاول تسمع مرة ثانية ببطء — الممارسة تحسّن كل شي 💪';
      document.getElementById(containerId).style.display = 'block';
    }

    function exCheckDict(){
      var t=exGetCurrentSentence(), w=document.getElementById('exDictField').value.trim();
      if(!t){exToast('تأكد إن في جملة ظاهرة بالموقع فوق');return;}
      if(!w){exToast('اكتب ما سمعته أولاً');return;}
      exShowRes('exDAcc','exDBadge','exDDiff','exDMsg','exDictRes',t,w);
    }

    function exCheckSpeech(){
      var t=exGetCurrentSentence(), s=document.getElementById('exSpeechField').value.trim();
      if(!t){exToast('تأكد إن في جملة ظاهرة بالموقع فوق');return;}
      if(!s){exToast('سجّل صوتك أولاً أو اكتب يدوياً');return;}
      exShowRes('exSAcc','exSBadge','exSDiff','exSMsg','exSpeechRes',t,s);
    }

    function exClearDict(){
      document.getElementById('exDictField').value='';
      document.getElementById('exDictRes').style.display='none';
    }
    function exClearSpeech(){
      document.getElementById('exSpeechField').value='';
      document.getElementById('exSpeechRes').style.display='none';
    }

    function exToast(msg){
      var t=document.getElementById('exToast');
      t.textContent=msg; t.classList.add('on');
      setTimeout(function(){t.classList.remove('on');},2800);
    }
    </script>

  </body>
</html>
